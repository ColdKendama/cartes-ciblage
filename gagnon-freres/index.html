<head>

  <meta name="robots" content="noindex, nofollow">
  <title>Ciblage géographique · Gagnon Frères</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">

  <link rel="stylesheet" href="../assets/carte.css">
  <script>
    // La seule chose propre à ce client : son nom et le lien CSV publié
    // de l'onglet « Carte » de son fichier de ciblage (File > Share >
    // Publish to web). Jamais le lien du classeur lui-même : ce dépôt est
    // public, et ce lien peut donner le droit de modifier le fichier.
    window.CARTE = {
      client: 'Gagnon Frères',
      source: 'A_REMPLACER_par_le_lien_CSV_publie',
    };
  </script>

  <div id="app"></div>
